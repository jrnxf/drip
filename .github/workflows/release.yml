name: Release

# Publishing a GitHub release attaches drip as one universal binary (Apple silicon and Intel),
# packed in drip-<version>-universal-apple-darwin.tar.gz with its .sha256, then points the Homebrew
# formula at it, so brew installs drip without compiling. The archive holds one directory of the
# same name, with the executable drip, README.md and LICENSE.
# Pull requests and a manual run build and check the same archive, kept as a workflow artifact
# only: they never make a release or a tag.
#
# Tap setup: jrnxf/homebrew-tap's docs/automatic-updates.md, which issues the TAP_DEPLOY_KEY
# secret. Formula/drip.rb must already exist in the tap and install the binary with
# `bin.install "drip"`: the bump script only updates a formula's url and sha256, it never adds a
# formula or its install step.
on:
  release:
    types: [published]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request replaces its run; a release always runs to the end.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'release' }}

permissions:
  contents: read

env:
  TARGET: universal-apple-darwin

jobs:
  binary:
    name: Build the universal binary
    runs-on: macos-15
    outputs:
      archive: ${{ steps.archive.outputs.archive }}
    steps:
      - uses: actions/checkout@v4
      - name: Build for arm64 and x86_64
        run: |
          set -- -c release --arch arm64 --arch x86_64
          swift build "$@"
          cp "$(swift build "$@" --show-bin-path)/drip" drip
      # The linker signs only the arm64 slice. An ad-hoc signature on both slices is what macOS
      # needs to run it; brew does not quarantine a formula's download, so Gatekeeper never asks
      # for more.
      - name: Sign ad hoc
        run: codesign --force --sign - drip
      - name: Check
        run: |
          lipo -info drip
          lipo drip -verify_arch arm64 x86_64
          codesign --verify --strict --all-architectures --verbose=2 drip
          codesign --display --verbose=2 drip 2>&1 | tee signature.txt
          grep -qx 'Signature=adhoc' signature.txt
          # macOS 13 is the oldest the README promises, for both slices.
          for arch in arm64 x86_64; do
            vtool -arch "$arch" -show-build drip | tee build.txt
            grep -Eq '^ +minos 13\.0$' build.txt
          done
          ./drip --version
          # The Intel slice, under Rosetta.
          arch -x86_64 ./drip --version
      - name: Check the version matches the release
        if: github.event_name == 'release'
        run: |
          version="$(./drip --version)"
          if [ "$version" != "${TAG#v}" ]; then
            echo "drip --version prints $version, but the release is $TAG" >&2
            exit 1
          fi
        env:
          TAG: ${{ github.event.release.tag_name }}
      # Named for the version drip prints, which the step above holds to the release's tag.
      - name: Archive
        id: archive
        run: |
          dir="drip-$(./drip --version)-$TARGET"
          mkdir "$dir"
          install -m 0755 drip "$dir/drip"
          install -m 0644 README.md LICENSE "$dir/"
          # No AppleDouble files for extended attributes, and no runner account in the headers.
          COPYFILE_DISABLE=1 tar -czf "$dir.tar.gz" --uid 0 --gid 0 --uname root --gname wheel "$dir"
          echo "archive=$dir.tar.gz" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Check the archive
        run: |
          tar -tvzf "$ARCHIVE"
          printf '%s\n' "$DIR/" "$DIR/LICENSE" "$DIR/README.md" "$DIR/drip" > expected.txt
          tar -tzf "$ARCHIVE" | LC_ALL=C sort | diff expected.txt -
          mkdir unpacked
          tar -xzf "$ARCHIVE" -C unpacked
          test "$(stat -f %Lp "unpacked/$DIR/drip")" = 755
          codesign --verify --strict --all-architectures "unpacked/$DIR/drip"
          "unpacked/$DIR/drip" --version
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
          DIR: ${{ steps.archive.outputs.dir }}
      - run: shasum -a 256 "$ARCHIVE" | tee "$ARCHIVE.sha256"
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.archive }}
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
          if-no-files-found: error

  upload:
    name: Attach the archive to the release
    if: github.event_name == 'release'
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      # To attach files to the release.
      contents: write
    steps:
      # Pinned to a commit: this job holds a token that can change the release.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.binary.outputs.archive }}
      - run: sha256sum --check "$ARCHIVE.sha256"
        env:
          ARCHIVE: ${{ needs.binary.outputs.archive }}
      - run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --repo "$GITHUB_REPOSITORY" --clobber
        env:
          ARCHIVE: ${{ needs.binary.outputs.archive }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}

  tap:
    name: Update the tap formula
    # A pre-release is for trying out; the formula follows full releases only.
    if: github.event_name == 'release' && !github.event.release.prerelease
    # The formula points at the attached archive, so it must be there first.
    needs: [binary, upload]
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit: this job holds the key that can push to the tap brew installs from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: jrnxf/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
      # One asset for every Mac: the script writes a top-level url and sha256, and checks the
      # asset against its .sha256.
      - run: scripts/bump-formula.sh drip "$TAG" "macos=$ARCHIVE"
        env:
          ARCHIVE: ${{ needs.binary.outputs.archive }}
          TAG: ${{ github.event.release.tag_name }}
      - run: |
          # A tap PR that points the formula at this release by hand leaves nothing to commit.
          if git diff --quiet; then
            echo "Formula/drip.rb already points at $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "drip $TAG"
          git push
        env:
          TAG: ${{ github.event.release.tag_name }}
