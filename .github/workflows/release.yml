name: Release

# Pushing a tag v<version> builds drip as one universal binary (Apple silicon and Intel), signed
# with drip's own certificate (see the Sign step), packed in
# drip-<version>-universal-apple-darwin.tar.gz with its .sha256, publishes the tag's GitHub release
# with both attached, then points the Homebrew formula at it, so brew installs drip without
# compiling. The archive holds one directory of the same name, with the executable drip, README.md,
# LICENSE and THIRD_PARTY.md.
#
# Two kinds of tag:
# - v0.1.0-pre.N, a development build: Sources/DripCore/Version.swift says 0.1.0-pre, and the build
#   stamps the tag's 0.1.0-pre.N in, so each build needs no commit. Its release is a pre-release.
#   Homebrew reads -pre.N from the archive's name and orders it before 0.1.0; it would read
#   -dev.N as plain 0.1.0.
# - v0.1.0, a full release: Version.swift must say 0.1.0 itself.
# The formula follows every full release, and pre-releases only until the first full one.
#
# A tag must be on main, with CI passed on its commit, or the build fails at once.
#
# Pull requests and a manual run build and check the same archive, kept as a workflow artifact
# only: they never make a release or a tag.
#
# Tap setup: jrnxf/homebrew-tap's docs/automatic-updates.md, which issues the TAP_DEPLOY_KEY
# secret. Formula/drip.rb must already exist in the tap and install the binary with
# `bin.install "drip"`: the bump script writes the formula's url and sha256, adding them to a
# HEAD-only formula, but it never adds a formula or its install step.
on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request replaces its run; a release always runs to the end.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  TARGET: universal-apple-darwin

jobs:
  binary:
    name: Build the universal binary
    runs-on: macos-15
    permissions:
      contents: read
      # To read the check runs of the tag's commit, for the step below.
      checks: read
    outputs:
      archive: ${{ steps.archive.outputs.archive }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A tag's whole history, to tell whether its commit is on main.
          fetch-depth: ${{ github.ref_type == 'tag' && 0 || 1 }}
      # A release goes out only from a commit that is on main and that CI has passed there: this
      # workflow runs no test itself, and CI runs on the tag in parallel and gates nothing. The
      # snapshot tests would not even pass here, as their references are those of CI's runner image.
      # A tag pushed before CI finished fails here: run the job again once it has.
      - name: Check the tag is on main and CI passed
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$TAG is on $GITHUB_SHA, which is not on main: a release goes out only from main" >&2
            exit 1
          fi
          runs="$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?filter=all&per_page=100" \
            --jq '.check_runs[] | "\(.name) \(.conclusion)"')"
          printf '%s\n' "$runs"
          missing=""
          for job in test snapshots; do
            printf '%s\n' "$runs" | grep -qx "$job success" || missing="$missing $job"
          done
          if [ -n "$missing" ]; then
            echo "CI has not passed on $GITHUB_SHA for:$missing" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
      - name: Stamp a pre-release's version
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          file=Sources/DripCore/Version.swift
          base="$(sed -n 's/^public let dripVersion = "\(.*\)"$/\1/p' "$file")"
          version="${TAG#v}"
          case "$version" in
            "$base")
              case "$base" in *-*) ;; *) exit 0 ;; esac
              number=""
              ;;
            *-*)
              case "$base" in *-*) number="${version#"$base".}" ;; *) number="" ;; esac
              ;;
            *) number="" ;;
          esac
          case "$number" in
            "" | "$version" | *[!0-9]*)
              case "$base" in *-*) want="v$base.<number>" ;; *) want="v$base" ;; esac
              echo "$file says $base, so the tag must be $want" >&2
              exit 1
              ;;
          esac
          sed -i '' "s/^public let dripVersion = \".*\"$/public let dripVersion = \"$version\"/" "$file"
          grep -qx "public let dripVersion = \"$version\"" "$file"
        env:
          TAG: ${{ github.ref_name }}
      - name: Build for arm64 and x86_64
        run: |
          set -- -c release --arch arm64 --arch x86_64
          swift build "$@"
          cp "$(swift build "$@" --show-bin-path)/drip" drip
      # Both slices signed with drip's own self-signed certificate, .github/signing/certificate.pem,
      # under the fixed identifier co.jrnxf.drip, so every release has the same designated
      # requirement: that identifier and that certificate, not the binary's hash. macOS ties a
      # privacy grant such as Local Network access to it, so a grant holds across updates, where an
      # ad-hoc signature made each build a new app. Gatekeeper still knows no developer for it, but
      # brew does not quarantine a formula's download, so it never asks.
      # The certificate's key is the SIGNING_CERTIFICATE_P12 secret, a base64 .p12, opened with
      # SIGNING_CERTIFICATE_PASSWORD. A tag must have them. Without them, as in a fork's pull
      # request, the binary is signed ad hoc, so the rest of the job still builds and checks it.
      - name: Sign
        id: sign
        run: |
          if [ -z "$P12" ]; then
            if [ "$GITHUB_REF_TYPE" = tag ]; then
              echo "A release is signed with drip's certificate, but SIGNING_CERTIFICATE_P12 is not set" >&2
              exit 1
            fi
            echo "No signing certificate, so signed ad hoc"
            codesign --force --sign - drip
            echo "kind=adhoc" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A keychain of its own for this job, deleted by the next step.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -hex 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          # codesign may use the key without asking.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain" \
            >/dev/null
          # codesign finds an identity only in a keychain on the search list.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          # Named by the committed certificate's hash, so a secret with any other key finds no
          # identity, rather than signing with a requirement the next release would not match.
          identity="$(openssl x509 -in .github/signing/certificate.pem -outform der | shasum -a 1 | cut -d ' ' -f 1)"
          codesign --force --timestamp=none --identifier co.jrnxf.drip --keychain "$keychain" \
            --sign "$identity" drip
          echo "kind=certificate" >> "$GITHUB_OUTPUT"
        env:
          P12: ${{ secrets.SIGNING_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.SIGNING_CERTIFICATE_PASSWORD }}
      - name: Delete the signing keychain
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/signing.p12"
          if [ -e "$RUNNER_TEMP/signing.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/signing.keychain-db"
          fi
      - name: Check
        run: |
          lipo -info drip
          lipo drip -verify_arch arm64 x86_64
          codesign --verify --strict --all-architectures --verbose=2 drip
          codesign --display --verbose=2 drip 2>&1 | tee signature.txt
          if [ "$SIGNED" = certificate ]; then
            grep -qx 'Identifier=co.jrnxf.drip' signature.txt
            grep -qx 'Authority=drip code signing' signature.txt
            # The same for every release: the identifier and the certificate, no hash of the build.
            identity="$(openssl x509 -in .github/signing/certificate.pem -outform der | shasum -a 1 | cut -d ' ' -f 1)"
            codesign --display --requirements - drip 2>&1 | tee requirement.txt
            grep -qxF "designated => identifier \"co.jrnxf.drip\" and certificate root = H\"$identity\"" requirement.txt
          else
            grep -qx 'Signature=adhoc' signature.txt
          fi
          # macOS 13 is the oldest the README promises, for both slices.
          for arch in arm64 x86_64; do
            vtool -arch "$arch" -show-build drip | tee build.txt
            grep -Eq '^ +minos 13\.0$' build.txt
          done
          ./drip --version
          # The Intel slice, under Rosetta.
          arch -x86_64 ./drip --version
        env:
          SIGNED: ${{ steps.sign.outputs.kind }}
      - name: Check the version matches the tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          version="$(./drip --version)"
          if [ "$version" != "${TAG#v}" ]; then
            echo "drip --version prints $version, but the tag is $TAG" >&2
            exit 1
          fi
        env:
          TAG: ${{ github.ref_name }}
      # Named for the version drip prints, which the step above holds to the tag.
      - name: Archive
        id: archive
        run: |
          dir="drip-$(./drip --version)-$TARGET"
          mkdir "$dir"
          install -m 0755 drip "$dir/drip"
          install -m 0644 README.md LICENSE THIRD_PARTY.md "$dir/"
          # No AppleDouble files for extended attributes, and no runner account in the headers.
          COPYFILE_DISABLE=1 tar -czf "$dir.tar.gz" --uid 0 --gid 0 --uname root --gname wheel "$dir"
          echo "archive=$dir.tar.gz" >> "$GITHUB_OUTPUT"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: Check the archive
        run: |
          tar -tvzf "$ARCHIVE"
          printf '%s\n' "$DIR/" "$DIR/LICENSE" "$DIR/README.md" "$DIR/THIRD_PARTY.md" "$DIR/drip" > expected.txt
          tar -tzf "$ARCHIVE" | LC_ALL=C sort | diff expected.txt -
          mkdir unpacked
          tar -xzf "$ARCHIVE" -C unpacked
          test "$(stat -f %Lp "unpacked/$DIR/drip")" = 755
          codesign --verify --strict --all-architectures "unpacked/$DIR/drip"
          "unpacked/$DIR/drip" --version
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
          DIR: ${{ steps.archive.outputs.dir }}
      - run: shasum -a 256 "$ARCHIVE" | tee "$ARCHIVE.sha256"
        env:
          ARCHIVE: ${{ steps.archive.outputs.archive }}
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.archive.outputs.archive }}
          path: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
          if-no-files-found: error

  release:
    name: Publish the release with the archive
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: binary
    runs-on: ubuntu-latest
    permissions:
      # To make the release and attach files to it.
      contents: write
    steps:
      # Pinned to a commit: this job holds a token that can change the release.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ needs.binary.outputs.archive }}
      - run: sha256sum --check "$ARCHIVE.sha256"
        env:
          ARCHIVE: ${{ needs.binary.outputs.archive }}
      # A draft until the archive is on it, so a published release always has one. A release made
      # by hand for the tag is kept, and gets the archive.
      - name: Make the release
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already has a release"
            exit 0
          fi
          case "$TAG" in
            *-*) kind=--prerelease ;;
            *) kind=--latest ;;
          esac
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft "$kind" \
            --title "drip ${TAG#v}" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
      - run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --repo "$GITHUB_REPOSITORY" --clobber
        env:
          ARCHIVE: ${{ needs.binary.outputs.archive }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
      - run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}

  tap:
    name: Update the tap formula
    if: github.event_name == 'push' && github.ref_type == 'tag'
    # The formula points at the attached archive, so it must be there first.
    needs: [binary, release]
    runs-on: ubuntu-latest
    steps:
      # Until drip's first full release, brew installs the latest pre-release; after it, only full
      # releases, so a pre-release never replaces a stable drip.
      - name: Check the formula follows this tag
        id: follow
        run: |
          case "$TAG" in
            *-*)
              full="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-pre-releases --exclude-drafts \
                --limit 1 --json tagName --jq '.[0].tagName // ""')"
              if [ -n "$full" ]; then
                echo "$full is out, so the formula stays on full releases"
                echo "bump=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              ;;
          esac
          echo "bump=true" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
      # Pinned to a commit: this job holds the key that can push to the tap brew installs from.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.follow.outputs.bump == 'true'
        with:
          repository: jrnxf/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
      # One asset for every Mac: the script writes a top-level url and sha256, and checks the
      # asset against its .sha256.
      - if: steps.follow.outputs.bump == 'true'
        run: scripts/bump-formula.sh drip "$TAG" "macos=$ARCHIVE"
        env:
          ARCHIVE: ${{ needs.binary.outputs.archive }}
          TAG: ${{ github.ref_name }}
      - if: steps.follow.outputs.bump == 'true'
        run: |
          # A tap PR that points the formula at this release by hand leaves nothing to commit.
          if git diff --quiet; then
            echo "Formula/drip.rb already points at $TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "drip $TAG"
          git push
        env:
          TAG: ${{ github.ref_name }}
