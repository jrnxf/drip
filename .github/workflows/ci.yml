name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # Pushes already cover branches in this repository; pull requests run only from forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    # Linux builds and tests DripCore. The rendering and snapshot tests run on a Mac, in the
    # snapshots job.
    runs-on: ubuntu-latest
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v5
      # .build holds absolute paths (its module cache), so the key names the checkout's path: a
      # cache from before a rename would not build.
      - uses: actions/cache@v5
        with:
          path: .build
          key: swiftpm-${{ runner.os }}-${{ github.repository }}-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-${{ github.repository }}-
      - run: swift build --build-tests
      - run: swift test --skip-build

  macos:
    # The release build, the way the Homebrew formula makes it for `brew install --HEAD`.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: swift build -c release
      - run: .build/release/drip --version

  snapshots:
    # Every test on a Mac, the snapshot comparisons too: each card drawn with `drip __render` against
    # its reference in Tests/Snapshots. A card that differs is kept as an artifact to look at.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    # Not macos-latest: the references were recorded on this image (snapshots.yml), and the next
    # image would fail every snapshot on a change that touches none. Bump both together, then record again.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: sw_vers
      # Swift Testing is built for macOS 14, so the tests are too, as in scripts/mac-check.sh.
      - run: swift test -Xswiftc -target -Xswiftc "$(uname -m)-apple-macosx14.0"
      # The deep suite of scripts/mac-e2e.sh runs in the live job; its self-test and the helper's
      # build fail here too, without waiting for that whole run.
      - run: swiftc -O -o "$RUNNER_TEMP/harness" scripts/mac-e2e/Harness.swift && "$RUNNER_TEMP/harness" --self-test
      - run: swiftc -typecheck scripts/mac-e2e/Helper.swift
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: snapshot-failures
          path: .build/snapshot-failures
          if-no-files-found: ignore

  live:
    # scripts/mac-e2e.sh, the deep suite: real cards at the top of the runner's screen, the hooks
    # Claude Code and Codex run, the pointer and clicks. It shows cards from a drip with its own queue
    # and state, so it runs here, on a Mac nobody works at, and refuses a Mac in use
    # (scripts/live-guard.sh). The screenshots it keeps are an artifact to look at.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DRIP_LIVE_CHECKS: isolated
    steps:
      - uses: actions/checkout@v5
      - run: sw_vers
      # Check 6 attaches tmux from Ghostty, then from Terminal. Ghostty comes with Homebrew's
      # quarantine, and its first launch is slow, so the check would see no Ghostty window: the
      # quarantine goes and Ghostty starts once first.
      - run: |
          brew install tmux
          brew install --cask ghostty
          xattr -dr com.apple.quarantine /Applications/Ghostty.app
          open /Applications/Ghostty.app && sleep 8 && killall ghostty
      # The runner's image turns Reduce Motion on, and with it cards fade instead of stacking.
      - run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          reduced=$(echo 'import AppKit; print(NSWorkspace.shared.accessibilityDisplayShouldReduceMotion)' | swift -)
          [ "$reduced" = false ] || { echo "Reduce Motion is still on" >&2; exit 1; }
      # Clicks and VoiceOver's actions go through the helper app mac-e2e.sh builds, which needs
      # Accessibility: nobody is here to answer the prompt, so the grant goes straight into the
      # runner's TCC database, by the helper's bundle id.
      - run: |
          sudo sqlite3 "/Library/Application Support/com.apple.TCC/TCC.db" \
            "INSERT OR REPLACE INTO access (service, client, client_type, auth_value, auth_reason, auth_version, flags)
             VALUES ('kTCCServiceAccessibility', 'co.jrnxf.drip.e2e-helper', 0, 2, 4, 1, 0);"
      - run: scripts/mac-e2e.sh --no-prompt --out "$RUNNER_TEMP/mac-e2e"
      - if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mac-e2e-screenshots
          path: ${{ runner.temp }}/mac-e2e
          if-no-files-found: ignore

  macos-oldest:
    # The release build with an older Swift than macos-latest has, as the README promises macOS 13
    # and Swift 6.0 or newer: Xcode 16.0, the oldest on the macOS 15 image, brings Swift 6.0.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.0.app/Contents/Developer
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift build -c release
      - run: .build/release/drip --version

  wasm:
    # DripCore compiled to WebAssembly, as the web page runs it, with its tests under wasmtime, so
    # a change that breaks the page's engine fails here. Cloudflare's Workers Builds builds the page.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    # The Wasm SDK must match the compiler exactly: web/tools.sh pins both.
    container: swift:6.4.1-noble
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install -y --no-install-recommends curl ca-certificates xz-utils
      - run: web/test.sh
